<h1>{{ note.title }}</h1>
<p>{{ note.content }}</p>


<p>
    <button onclick="toggleLike( {{ note.pk }} )">
        {% if user_liked %}👎 Unlike{% else %}👍 Like{% endif %}
    </button>
    <span id="like-count">{{ like_count }} Likes</span>
</p>


<h3>Comments</h3>

<form action="{% url 'notes:add_comment' note.pk %}" method="post">
    {% csrf_token %}
    {{ comment_form.as_p }}
    <button type="submit">Send</button>
</form>

<ul>
{% for comment in comments %}
    <li>
        <strong>{{ comment.user.username }}:</strong> {{ comment.content }}
        <small>{{ comment.created_at }}</small>
    </li>
{% empty %}
    <p>No comments yet.</p>
{% endfor %}
</ul>

<a href="{% url 'notes:list' %}">Back to List</a>


<script>
function toggleLike(noteId) {
    fetch(`/notes/like/${noteId}/`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('like-count').innerText = data.like_count + ' Likes';
            location.reload();
        });
}
</script>
