<h1>Public Notes Feed</h1>

{% for note in notes %}
    <div style="border: 1px solid #ccc; margin: 10px; padding:10px;">
        <strong>{{ note.owner.username }}</strong>
        <a href="{% url 'notes:detail' note.id %}">
            <h3>{{ note.title}}</h3>
        </a>
        <p>{{ note.content }}</p>
        <small>{{ note.created_at }}</small>
    </div>
{% empty %}
    <p>No public notes yet.</p>
{% endfor %}

<a href="{% url 'notes:list' %}">My Notes</a>
