<h1>My Notes</h1>
<a href="{% url 'notes:create' %}">New Note</a>

<ul>
    {% for note in notes %}
        <li>
            <a href="{% url 'notes:detail' note.pk %}">{{ note.title }}</a>
            <a href="{% url 'notes:update' note.pk %}">Edit</a>
            <a href="{% url 'notes:delete' note.pk %}">Delete</a>
        </li>
{% empty %}
    <p>No notes yet.</p>
{% endfor %}
</ul>
