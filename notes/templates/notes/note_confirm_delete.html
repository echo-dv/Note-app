{% extends "base.html" %}
{% block title %}Delete {{ object.title }} · Notes{% endblock %}
{% block content %}
<section class="auth-page">
<div class="confirm-card">
    <span class="eyebrow">DESTRUCTIVE ACTION</span>
    <h1>Delete this note?</h1>
    <p>You're about to permanently delete:</p>
    <div class="delete-preview">{{ object.title }}</div>
    <p class="muted">This cannot be undone.</p>
    <form method="post" class="confirm-actions">{% csrf_token %}<a href="{% url 'notes:detail' object.pk %}" class="button button-secondary">Cancel</a><button type="submit" class="button button-danger">Delete permanently</button></form>
</div>
</section>
{% endblock %}
